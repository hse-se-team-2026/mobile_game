name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  generate:
    name: Generate SQLDelight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate SQLDelight Interface
        run: ./gradlew :shared:generateSqlDelightInterface --no-daemon

      - name: Upload Generated Code
        uses: actions/upload-artifact@v4
        with:
          name: generated-sqldelight
          path: shared/build/generated/
          retention-days: 1

  build-jvm:
    name: Build Shared Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: generate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-sqldelight
          path: shared/build/generated/

      - name: Compile shared metadata
        run: ./gradlew :shared:compileKotlinMetadata --no-daemon

  build-android:
    name: Build Android Target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: generate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-sqldelight
          path: shared/build/generated/

      - name: Compile Android
        run: ./gradlew :shared:compileAndroidMain --no-daemon

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-jvm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-sqldelight
          path: shared/build/generated/

      - name: Run Android host tests
        run: ./gradlew :shared:testAndroidHostTest --no-daemon

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: shared/build/test-results/
          retention-days: 7

  detekt:
    name: Detekt (Code Quality)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-sqldelight
          path: shared/build/generated/

      - name: Run Detekt
        run: ./gradlew :shared:detekt --no-daemon

  ktfmt:
    name: ktfmt (Formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-sqldelight
          path: shared/build/generated/

      - name: Check ktfmt
        run: ./gradlew :shared:ktfmtCheck --no-daemon

  build-all:
    name: Full Build (main only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    needs: [generate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Generated Code
        uses: actions/download-artifact@v4
        with:
          name: generated-sqldelight
          path: shared/build/generated/

      - name: Full Build
        run: ./gradlew :shared:build --no-daemon

      - name: Upload Build Outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: shared/build/outputs/
          retention-days: 7
